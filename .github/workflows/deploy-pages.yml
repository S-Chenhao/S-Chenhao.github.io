name: Deploy academic homepage

on:
  push:
    branches: ["main"]
  # 08:23 Asia/Shanghai; GitHub may delay scheduled runs.
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-scholar:
    name: Refresh Google Scholar
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Scholar parser and failure handling
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Fetch and validate Scholar via SerpApi
        timeout-minutes: 4
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/sync_scholar_api.py --scholar-id Vqf7dwEAAAAJ --curated data/publications.json

      - name: Save successfully synchronized data
        run: |
          git add -- public/scholar.json data/scholar-pending.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Google Scholar statistics"
            git push origin HEAD:main
          fi

      - name: Select published repository revision
        id: revision
        if: ${{ always() }}
        run: |
          git fetch origin main
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"

      - name: Explain retained data on failure
        if: ${{ failure() }}
        run: |
          echo "::warning::Scholar synchronization failed. The homepage will retain the last committed data and its original timestamp."
          echo "Scholar sync failed; retained the last committed snapshot. A later daily run will retry." >> "$GITHUB_STEP_SUMMARY"

  build:
    # A blocked Scholar request must not prevent normal homepage publication.
    if: ${{ always() && !cancelled() }}
    needs: sync-scholar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synchronized data or last good snapshot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync-scholar.outputs.revision || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test citation matching and display dates
        run: node --experimental-strip-types --test lib/scholar.test.mjs

      - name: Build static site
        run: pnpm run build:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
